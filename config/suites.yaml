suites:
  demo-api:
    runner_type: pytest
    working_directory: .
    argv:
      - python
      - -m
      - pytest
      - demo_suites/api/test_target.py
      - -q
    timeout_seconds: 3
    allowed_parameters:
      scenario:
        - ok
        - error
        - slow
    gate_policy:
      min_pass_rate: 1.0
      max_failures: 0
    source_revision: main
  demo-load:
    runner_type: locust
    working_directory: .
    argv:
      - python
      - -m
      - locust
      - -f
      - demo_suites/load/locustfile.py
      - --users
      - '1'
      - --spawn-rate
      - '10'
      - --run-time
      - 3s
    timeout_seconds: 15
    allowed_parameters:
      scenario:
        - baseline
        - degraded
    gate_policy:
      max_error_rate: 0.01
      max_p95_ms: 250
      min_requests: 3
    source_revision: main
  restful-booker-api:
    runner_type: pytest
    working_directory: demo_suites/restful_booker
    argv:
      - python
      - -m
      - pytest
      - tests/test_booking_crud.py
      - -q
      - --strict-markers
    timeout_seconds: 120
    allowed_parameters: {}
    gate_policy:
      min_pass_rate: 1.0
      max_failures: 0
    source_revision: restful-booker@387568c
