suites:
  demo-api:
    test_type: api
    runner_type: pytest
    working_directory: .
    argv:
      - python
      - -m
      - pytest
      - demo_suites/api/test_target.py
      - -q
    timeout_seconds: 3
    allowed_parameters:
      scenario:
        - ok
        - error
        - slow
    gate_policy:
      min_pass_rate: 1.0
      max_failures: 0
    retry_policy:
      max_attempts: 2
      retry_on:
        - worker_lost
    source_revision: main
  demo-load:
    test_type: performance
    runner_type: locust
    working_directory: .
    argv:
      - python
      - -m
      - locust
      - -f
      - demo_suites/load/locustfile.py
      - --users
      - '1'
      - --spawn-rate
      - '10'
      - --run-time
      - 3s
    timeout_seconds: 15
    allowed_parameters:
      scenario:
        - baseline
        - degraded
    gate_policy:
      max_error_rate: 0.01
      max_p95_ms: 250
      min_requests: 3
    source_revision: main
  demo-workflow:
    test_type: api
    runner_type: workflow
    working_directory: demo_suites/workflow
    argv:
      - workflow
      - resource_lifecycle.yaml
    timeout_seconds: 30
    allowed_parameters: {}
    request_body:
      required: true
      schema:
        type: object
        additionalProperties: false
        required: [name, updated_name]
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 100
          updated_name:
            type: string
            minLength: 1
            maxLength: 100
      example:
        name: Ada
        updated_name: Grace
    gate_policy:
      min_pass_rate: 1.0
      max_failures: 0
      max_error_rate: 0.0
    source_revision: main
  demo-agent-eval:
    test_type: agent
    runner_type: agent_eval
    working_directory: demo_suites/agent_eval
    argv:
      - agent_eval
      - safety.yaml
    timeout_seconds: 30
    allowed_parameters: {}
    request_body:
      required: false
      schema:
        type: object
        additionalProperties: false
        properties:
          topic:
            type: string
            minLength: 1
            maxLength: 200
      example:
        topic: quality engineering
    gate_policy:
      min_pass_rate: 1.0
      max_failures: 0
      max_error_rate: 0.0
    source_revision: main
  restful-booker-api:
    test_type: api
    runner_type: pytest
    working_directory: demo_suites/restful_booker
    argv:
      - python
      - -m
      - pytest
      - tests/test_booking_crud.py
      - -q
      - --strict-markers
    timeout_seconds: 120
    allowed_parameters: {}
    request_body:
      required: false
      schema:
        type: object
        additionalProperties: false
        required:
          - firstname
          - lastname
          - totalprice
          - depositpaid
          - bookingdates
          - additionalneeds
        properties:
          firstname:
            type: string
            minLength: 1
            maxLength: 100
          lastname:
            type: string
            minLength: 1
            maxLength: 100
          totalprice:
            type: integer
            minimum: 0
          depositpaid:
            type: boolean
          bookingdates:
            type: object
            additionalProperties: false
            required: [checkin, checkout]
            properties:
              checkin:
                type: string
                pattern: '^\d{4}-\d{2}-\d{2}$'
              checkout:
                type: string
                pattern: '^\d{4}-\d{2}-\d{2}$'
          additionalneeds:
            type: string
            maxLength: 500
      example:
        firstname: Ada
        lastname: Lovelace
        totalprice: 188
        depositpaid: true
        bookingdates:
          checkin: '2027-10-01'
          checkout: '2027-10-05'
        additionalneeds: Breakfast
    gate_policy:
      min_pass_rate: 1.0
      max_failures: 0
    source_revision: restful-booker@387568c
