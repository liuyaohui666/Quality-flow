[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-flow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Alembic>=1.13,<2",
    "celery>=5.5,<6",
    "fastapi>=0.111,<1",
    "httpx>=0.27,<1",
    "locust>=2.40,<3",
    "psutil>=6,<8",
    "pywin32>=306; sys_platform == 'win32'",
    "pydantic>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "PyYAML>=6.0",
    "redis>=6,<7",
    "SQLAlchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
